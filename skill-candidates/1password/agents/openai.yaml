interface:
  display_name: "1Password Credential Broker"
  short_description: "Authenticate authorized provider sessions without exposing secrets."
  default_prompt: >-
    Automatically use 1Password desktop/browser integration or narrowly scoped
    CLI secret references on Windows when an authorized workflow needs an
    existing login such as Bugcrowd. Keep passwords, TOTP codes, recovery
    material, tokens, cookies, and raw secret fields out of model context,
    logs, files, screenshots, shell history, and clipboard.
policy:
  allow_implicit_invocation: true
